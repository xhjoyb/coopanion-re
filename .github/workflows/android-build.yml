name: android-build

# 用途：把 P8 还原出的 Android 工程真编译一次，用 javac/d8 的报错驱动收尾。
# 本地 proot 无 JDK，所以编译放在 Actions。
on:
  workflow_dispatch:
  push:
    paths:
      - 'project/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: project/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 35
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list_installed | sed -n '1,20p'

      - name: Gradle assembleDebug
        id: gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug --stacktrace 2>&1 | tee build.log
          echo "GRADLE_EXIT=0" >> "$GITHUB_ENV"

      - name: Error summary
        if: always()
        run: |
          echo "### 编译结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            ERRS=$(grep -cE '(^|: )error: |^e: ' build.log || true)
            echo "- error 行数：**$ERRS**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|: )error: |^e: ' build.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- error lines (console) ---"
            grep -E '(^|: )error: |^e: ' build.log | head -200 || true
          else
            echo "- build.log 未生成（Gradle 未启动）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: project/android/build.log
          if-no-files-found: warn

      - name: Upload debug apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn