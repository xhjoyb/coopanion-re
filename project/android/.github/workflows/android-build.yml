name: android-build

# 用途：把 project/android 逆向还原工程真编译一次（assembleDebug），
# 用编译器报错驱动收尾。APK 与完整构建日志都以 artifact 形式留存。
# 本地 proot 无 JDK/SDK，编译只能放 Actions 跑。

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它装 cmdline-tools 时会撞上
      # 「Review licenses (y/N)」交互提示导致 step 直接失败（首轮实测）。
      - name: Prepare Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "ERROR: sdkmanager not found"; exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: Gradle assembleDebug
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Error summary
        if: always()
        run: |
          echo "### 编译结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            ERRS=$(grep -cE 'error: |^e: ' build.log || true)
            echo "- error 行数：**$ERRS**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error: |^e: ' build.log | head -150 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- error lines (console) ---"
            grep -E 'error: |^e: ' build.log | head -200 || true
          else
            echo "- build.log 未生成（Gradle 未启动）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn