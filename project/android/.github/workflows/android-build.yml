name: android-build

# 用途：把 project/android 逆向还原工程真编译一次（assembleDebug），
# 用编译器报错驱动收尾。产物 APK + 完整构建日志都以 artifact 形式留存。
# 本地 proot 无 JDK/SDK，编译只能放 Actions 跑。

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: chmod gradlew
        run: chmod +x gradlew || true

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --continue \
            -Dorg.gradle.jvmargs=-Xmx3g 2>&1 | tee build.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize javac errors
        if: always()
        run: |
          echo '### Build tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '### error lines' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(e: |.*error: )' build.log | head -n 300 >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### error count' >> "$GITHUB_STEP_SUMMARY"
          printf 'total_errors=%s\n' "$(grep -cE 'error: ' build.log || true)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
