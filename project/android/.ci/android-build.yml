name: android-build

# 用途：把 P8 还原出的 Android 工程真编译一次，用 javac/d8 的报错驱动收尾。
# 本地 proot 无 JDK，所以编译放 Actions。
on:
  workflow_dispatch:
  push:
    paths:
      - 'project/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: project/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不依赖 android-actions/setup-android：该 action 装 cmdline-tools 时会卡在
      # 「Review licenses (y/N)」交互提示上直接失败（首轮实测）。runner 镜像自带
      # Android SDK，手动接受许可证再补装 platform 35 更稳。
      - name: Prepare Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SDKM"
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "ERROR: sdkmanager not found"; exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "--- platforms ---"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || true
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: Gradle assembleDebug
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Error summary
        if: always()
        run: |
          echo "### 编译结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            ERRS=$(grep -cE 'error: |^e: ' build.log || true)
            echo "- error 行数：**$ERRS**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error: |^e: ' build.log | head -150 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- error lines (console) ---"
            grep -E 'error: |^e: ' build.log | head -200 || true
          else
            echo "- build.log 未生成（Gradle 未启动）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: project/android/build.log
          if-no-files-found: warn

      - name: Upload debug apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn